id: 0x0109
slug: hasse-teoremi
version: 1
status: active

doc:
  name: "Hasse's Theorem"
  latex: '|\#E(\mathbb{F}_p) - (p+1)| \le 2\sqrt{p}'
  domain: "elliptic-curves"
  summary: >
    States that the number of points on an elliptic curve over a finite field
    is near p+1, with the deviation bounded by 2 times the square root of p.
  notes: >
    Knowing in advance how large the group order can be is decisive when
    choosing a curve. If the order factors into small primes, the
    Pohlig-Hellman attack makes the discrete logarithm easier, so curves whose
    order contains a large prime factor are chosen.

    The Hasse interval is about 4 times the square root of p wide. For a 256
    bit p that leaves uncertainty on the order of 2^128, and yet the order can
    be counted in polynomial time with Schoof's algorithm.

    The cofactor is h = #E / n and should be small. A large h opens the small
    subgroup confinement attack.
  tags: [ecc, hasse, group-order, schoof, pohlig-hellman, cofactor]
  references:
    - "Hasse, Zur Theorie der abstrakten elliptischen Funktionenkörper, 1936"
    - "Silverman, The Arithmetic of Elliptic Curves, V.1"
  related: [0x0101, 0x0106, 0x0107]

params:
  - name: p
    type: prime
    bits: 128
    role: public
    description: "Prime characteristic of the field."
  - name: nokta_sayisi
    type: uint
    bits: 128
    role: public
    description: "Number of points on the curve, #E, including the point at infinity."
  - name: kofaktor
    type: uint
    bits: 16
    role: public
    description: "h = #E / n, the index of the subgroup generated by the base point."

constraints:
  - expr: "p > 3"
    reason: "An elliptic curve needs a characteristic greater than 3."
    severity: error
  - expr: "nokta_sayisi > 0"
    reason: "The point count must be positive."
    severity: error
  - expr: "kofaktor > 0"
    reason: "The cofactor is a positive integer."
    severity: error
  - expr: "kofaktor <= 8"
    reason: "A large cofactor leaves the door open to small subgroup confinement attacks."
    severity: warning

sampler:
  strategy: uniform_valid
  max_rejections: 1000
