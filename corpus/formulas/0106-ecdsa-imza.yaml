id: 0x0106
slug: ecdsa-imza
version: 1
status: active

doc:
  name: "ECDSA Signature Generation"
  latex: 'r = (kG)_x \bmod n, \quad s = k^{-1}(h + r d) \bmod n'
  domain: "elliptic-curves"
  summary: >
    The signing step of the elliptic curve digital signature algorithm. A
    signature pair (r, s) is produced from the private key d and the message
    digest h.
  notes: >
    CRITICAL: k must be FRESH and UNPREDICTABLE on every signature. If the
    same k is used for two different messages, the private key d falls out
    with simple algebra: k is eliminated between the two equations and d is
    the only unknown left. The Sony PlayStation 3 signing key leaked in 2010
    from exactly this mistake. RFC 6979 removes the risk by deriving k
    deterministically from the message and the key. Even partial flaws in k's
    randomness can give up the whole key through lattice attacks.
  tags: [ecdsa, signature, nonce, secret-key, rfc6979]
  references:
    - "FIPS 186-4, §6.4"
    - "RFC 6979 (Deterministik DSA ve ECDSA)"
  related: [0x0101, 0x0107]

params:
  - name: n
    type: prime
    bits: 256
    role: public
    description: "Order of the group generated by the base point G."
  - name: h
    type: uint
    bits: 256
    role: public
    description: "Digest of the message being signed, as an integer."
  - name: d
    type: scalar
    mod: n
    bits: 256
    role: secret
    description: "The signer's private key. NOT written into the ciphertext."
  - name: k
    type: scalar
    mod: n
    bits: 256
    role: secret
    description: "Signature nonce. Fresh on every signature, never repeated."
  - name: r
    type: scalar
    mod: n
    bits: 256
    role: public
    description: "First component of the signature."
  - name: s
    type: scalar
    mod: n
    bits: 256
    role: public
    description: "Second component of the signature."

constraints:
  - expr: "k % n != 0"
    reason: "k cannot be zero, k^-1 would be undefined."
    severity: error
  - expr: "d % n != 0"
    reason: "The private key cannot be zero."
    severity: error
  - expr: "r % n != 0"
    reason: "If r = 0 the signature is invalid and must be retried with a new k."
    severity: error
  - expr: "s % n != 0"
    reason: "If s = 0 the signature is invalid and must be retried with a new k."
    severity: error
  - expr: "d < n"
    reason: "The private key must be smaller than the group order."
    severity: error
  - expr: "k < n"
    reason: "The nonce must be smaller than the group order."
    severity: error

sampler:
  strategy: uniform_valid
  max_rejections: 1000
