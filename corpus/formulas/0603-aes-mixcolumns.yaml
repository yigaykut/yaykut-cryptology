id: 0x0603
slug: aes-mixcolumns
version: 1
status: active

doc:
  name: "AES MixColumns"
  latex: '\mathbf{c}'' = M \mathbf{c} \text{ in } \mathrm{GF}(2^8), \quad M = \mathrm{circ}(2, 3, 1, 1)'
  domain: "symmetric-stream"
  summary: >
    Multiplies each column of the AES state matrix by a fixed circulant matrix
    over GF(2^8). It is the cipher's diffusion layer.
  notes: >
    This is the component responsible for diffusion: changing a single byte in
    a column changes all four bytes of that column. Together with ShiftRows, a
    single bit change spreads across the whole 128 bit block within two
    rounds. The matrix has the MDS (maximum distance separable) property,
    which guarantees at least 5 active bytes across input and output and gives
    a provable lower bound against differential attacks. The coefficients 1, 2
    and 3 were chosen because GF(2^8) multiplication by those values needs
    only shifts and XOR, which is very cheap on 8 bit processors. MixColumns
    is NOT applied in the final round, which keeps the encryption and
    decryption structures symmetric.
  tags: [aes, mixcolumns, diffusion, mds, galois-field, circulant-matrix]
  references:
    - "FIPS 197 (AES), §5.1.3"
    - "Daemen & Rijmen, The Design of Rijndael, §3.4"
  related: [0x0602, 0x0601]

params:
  - name: col_in
    type: bytes
    bits: 32
    role: public
    description: "Input column, 4 bytes."
  - name: col_out
    type: bytes
    bits: 32
    role: public
    description: "Output column, 4 bytes."

constraints: []

sampler:
  strategy: uniform_valid
  max_rejections: 1000
