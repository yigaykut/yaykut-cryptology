# Continuous integration.
#
# WHAT IS A GATE AND WHAT IS NOT
#
# Gates: the tests, corpus validation, fuzzing and the measurement tools
# that give a decidable answer. All of them are deterministic or carry
# their own positive control.
#
# NOT gates: the timing measurements (`sidechannel.py`, `ccore.c_timing`).
# Shared runners are loaded and the noise floor moves from run to run.
# Gating on them produces regular false alarms, and a CI that cries wolf
# teaches people to ignore it, which hides the real breakage too. They run
# with `continue-on-error`, so the result is recorded without breaking the
# branch.
#
# THE COVERT MODE PASSWORD IS NOT IN CI and should not be. With
# `CRYPTO_NETWORK_PASSWORD` unset the covert network tests are SKIPPED
# (ADR-029 §5). Skipped is not passed, so the step prints the skip count.
#
# THE ACTIONS ARE PINNED TO COMMITS, not to tags. A tag is a name its owner
# can move, so `@v4` means "whatever the owner is publishing today" and a
# compromised account changes what runs here without anything in this repo
# changing. The comment after each hash records which release it was, since
# a hash on its own tells a reader nothing. Dependabot moves them (see
# `.github/dependabot.yml`), which puts the change in a reviewable diff.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # The checkout action otherwise leaves the job token in
          # .git/config, where every later step in the job can read it.
          # Nothing here pushes, so it is not needed.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # CPU torch wheel: the default index pulls the CUDA build, which is
          # about 2 GB. CPU is more than enough for models this small.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Build the C core (optional component)
        shell: bash
        continue-on-error: true
        run: python ccore/build.py

      - name: Corpus validation
        run: python corpus/validate.py

      - name: Test suite
        shell: bash
        run: |
          # CRYPTO_NETWORK_PASSWORD is NOT set, so covert mode tests skip.
          python -m pytest tests/ -q -p no:cacheprovider --tb=short -rs

      - name: Make the skip count visible
        if: always()
        shell: bash
        run: |
          echo "Covert network tests skip without CRYPTO_NETWORK_PASSWORD."
          echo "Skipped is not passed. See ADR-029 §5."

  measurements:
    name: measurement tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # The checkout action otherwise leaves the job token in
          # .git/config, where every later step in the job can read it.
          # Nothing here pushes, so it is not needed.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Engine walkthrough
        run: python demo.py

      - name: Fuzzing
        run: python fuzz.py

      - name: Coverage guided fuzzing
        run: python coverage_fuzz.py

      # `generated_corpus/` is not committed because it rebuilds exactly from
      # the seed. The exam has to generate first or it has nothing to look at.
      - name: Generate entries
        run: python -m layer2.generator --seed 0

      - name: Generated entry exam (five gates)
        run: python -m layer2.exam

      - name: Prekey protection
        run: python -m layer2.selector_attack

      - name: Canary trap
        run: python -m layer2.canary_experiment --member 30 --trial 60

      - name: Traffic analysis
        run: python -m layer2.traffic --round 200

      # The covert network measurement needs the password. CI does not have
      # it, so this measurement CANNOT RUN and the tool exits 2. Counting
      # that as a failure would be wrong. A measurement that did not run is
      # neither a pass nor a break.
      - name: Covert network measurement (no password, cannot run)
        continue-on-error: true
        run: python -m layer2.network_attack --round 200

  timing:
    name: timing (informational, not a gate)
    runs-on: ubuntu-latest
    # On a shared runner the timing noise can be larger than the signal.
    # It runs so the result is on record, and it is not a gate so it cannot
    # break the branch.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # The checkout action otherwise leaves the job token in
          # .git/config, where every later step in the job can read it.
          # Nothing here pushes, so it is not needed.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Side channel sweep
        run: python sidechannel.py
      - name: X25519 timing (rdtsc, from inside C)
        run: python -m ccore.c_timing --samples 1000
